# Consumes the org standard tagless Flutter release pipeline
# (tkforgeworks/.github release-flutter.yml). Windows only for now: the
# installer comes from scripts/release/build-windows.ps1 (Inno Setup,
# windows/installer/anvil.iss); there is no Android build.
#
# How a release happens (docs/branching-and-release.md in the org repo):
#   scripts/release/bump-version.sh rc     on vX.Y.Z/main → prerelease vX.Y.Z-rc.N
#   scripts/release/bump-version.sh final  on vX.Y.Z/main → release PR; merging
#                                          into main cuts the stable vX.Y.Z
# The bump is an ordinary commit to pubspec.yaml; release-flutter.yml
# self-gates on whether the version's tag exists (a stable version on a
# release branch and an RC version on main are both skipped) and creates the
# tag when it publishes the GitHub release. Never hand-edit the version or
# push tags.
#
# Release notes are the org release-notes.yml output (commit subjects since
# the previous tag, ANVL keys linked through the JIRA_BASE_URL variable).
# release-flutter.yml takes no extra notes file or prefix, so upgrade notes
# (ANVL-201) cannot be injected here without an org workflow change.
#
# The release gate is ci-flutter.yml at the repo root only, so it runs the
# app's test/ but not packages/anvil_core's tests; ci.yml's `core / ci`
# check on the release PR covers those.
#
# Keep flutter-version identical to ci.yml and .fvmrc (ANVL-167).
name: Release

on:
  push:
    branches: [main, 'v*/main']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: tkforgeworks/.github/.github/workflows/release-flutter.yml@main
    with:
      ticket-prefix: ANVL
      flutter-version: '3.47.5'
      build-windows: true
      build-android: false
    secrets: inherit

  # Linux packaging (ANVL-168) goes here as its own job, per the org rule that
  # a new pipeline capability is its own reusable workflow rather than more
  # inputs on release-flutter.yml. Note for that ticket: release-flutter.yml
  # publishes the release itself, and once immutable releases are turned on
  # (off for this repo as of 2026-11-03) assets are locked at publish time,
  # so a job running after `release` could no longer upload to it.
