name: Release

on:
  push:
    branches: [master]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check-release:
    runs-on: ubuntu-latest
    outputs:
      should-release: ${{ steps.check.outputs.should-release }}
      version: ${{ steps.check.outputs.version }}
      is-prerelease: ${{ steps.check.outputs.is-prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists — skipping release"
            echo "should-release=false" >> $GITHUB_OUTPUT
          else
            echo "Tag $TAG does not exist — will release"
            echo "should-release=true" >> $GITHUB_OUTPUT
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            if echo "$VERSION" | grep -qE '(rc|alpha|beta)'; then
              echo "is-prerelease=true" >> $GITHUB_OUTPUT
            else
              echo "is-prerelease=false" >> $GITHUB_OUTPUT
            fi
          fi

  # TK ForgeWorks standard release-notes generation — canonical script and
  # workflow live in tkforgeworks/.github. release-version is passed
  # explicitly because this workflow runs before the tag is created.
  release-notes:
    if: needs.check-release.outputs.should-release == 'true'
    needs: check-release
    uses: tkforgeworks/.github/.github/workflows/release-notes.yml@main
    with:
      ticket-prefix: ANV
      release-version: v${{ needs.check-release.outputs.version }}

  build:
    if: needs.check-release.outputs.should-release == 'true'
    needs: check-release
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse2 rpm
      - run: npm ci
      - run: npm run make
        env:
          VITE_TELEMETRY_ENABLED: ${{ needs.check-release.outputs.is-prerelease }}
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: dist/make/**/*

  publish:
    if: needs.check-release.outputs.should-release == 'true'
    needs: [check-release, release-notes, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Immutable releases lock assets at publish time, so the release is
      # created as a draft with assets attached, then flipped to published.
      # Publishing creates the v{version} tag at the triggering commit.
      - uses: softprops/action-gh-release@v2
        id: draft
        with:
          tag_name: v${{ needs.check-release.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: dist/**/*
          body: ${{ needs.release-notes.outputs.body }}
          draft: true
          prerelease: ${{ needs.check-release.outputs.is-prerelease }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PATCH repos/${{ github.repository }}/releases/${{ steps.draft.outputs.id }} -F draft=false
