name: anvil
description: "Desktop RPG data manager: classes, abilities, items, recipes, NPCs and loot tables in one .anvil project file. A TK ForgeWorks product."
publish_to: 'none'

# X.Y.Z[-rc.N]+BUILD. The release branch name (vX.Y.Z/main) is the source of
# X.Y.Z; scripts/release/bump-version.{sh,ps1} (ANVL-167) rewrites this line.
# The manifest holds the upcoming version, per the org convention.
version: 0.2.0+1

environment:
  # Floor matches forge-ui (sdk ^3.13.2, Flutter >=3.47.2); the repo pins
  # Flutter 3.47.5 in .fvmrc, the same SDK the org CI uses.
  sdk: ^3.13.2
  flutter: ">=3.47.2"

# Dart pub workspace: the Flutter app at the root plus the Flutter-free core.
workspace:
  - packages/anvil_core

dependencies:
  # Data, formula, validation and export logic. Pure Dart; it must never
  # depend on package:flutter (see README "Repository layout").
  anvil_core:
    path: packages/anvil_core
  flutter:
    sdk: flutter
  # The shared tkforgeworks theme, widgets and bundled fonts (Poppins,
  # JetBrains Mono, Source Serif 4). Pinned to an exact release tag; fixes go
  # into forge-ui and the pin moves. The app declares no fonts of its own.
  forge_ui:
    git:
      url: https://github.com/tkforgeworks/forge-ui.git
      ref: v0.2.2
  # State management (design §8.1): hand-written providers and notifiers,
  # no code generation.
  flutter_riverpod: ^3.4.0
  # The application support directory for settings, recent projects and
  # logs (design §14). A plugin, so it lives in the app, not the core.
  path_provider: ^2.1.5
  # The native folder picker and the .anvil open dialog (Flutter team
  # plugin). Only lib/app/dialogs/file_dialogs.dart imports it.
  file_selector: ^1.1.0
  # Routing (design §13.2): the shell route with the sidebar and app bar
  # and one route per page. Only lib/app/shell/ imports it.
  go_router: ^18.1.2
  # External links (design §13.4), https only, as 0.1.6's shell.openExternal
  # (Flutter team plugin). Only lib/app/menu/external_links.dart imports it.
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
